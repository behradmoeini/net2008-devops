<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#33475b"/></marker></defs>
<rect x="1" y="1" width="848" height="398" rx="3" fill="#f6fbff" stroke="#d3e3ee"/>
<text x="425" y="40" font-size="23" fill="#33475b">Terraform builds the server. Ansible sets it up.</text>
<rect x="30" y="70" width="230" height="90" fill="#cdeaf8" stroke="#4ab8e8"/>
<rect x="30" y="70" width="230" height="30" fill="#4ab8e8"/>
<text x="145" y="91" font-size="15" fill="#fff">Terraform (Week 11)</text>
<text x="145" y="124" font-size="13" font-weight="400" fill="#33475b">creates VMs, networks,</text>
<text x="145" y="143" font-size="13" font-weight="400" fill="#33475b">containers</text>
<rect x="590" y="70" width="230" height="90" fill="#78b83e"/>
<text x="705" y="92" font-size="15" fill="#fff">Ansible (today)</text>
<text x="705" y="120" font-size="13" font-weight="400" fill="#fff">installs packages, copies files,</text>
<text x="705" y="138" font-size="13" font-weight="400" fill="#fff">creates users, starts services</text>
<path d="M145 160 V218" stroke="#33475b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="157" y="196" font-size="13" text-anchor="start" fill="#33475b">creates</text>
<path d="M705 160 V218" stroke="#33475b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="693" y="196" font-size="13" text-anchor="end" fill="#33475b">sets it up</text>
<rect x="30" y="222" width="230" height="90" fill="#fff" stroke="#2d526e" stroke-width="2" stroke-dasharray="6 4"/>
<text x="145" y="254" font-size="16" fill="#33475b">An empty server</text>
<text x="145" y="278" font-size="13" font-weight="400" fill="#33475b">It exists and has an address.</text>
<text x="145" y="296" font-size="13" font-weight="400" fill="#33475b">Nothing is installed.</text>
<rect x="590" y="222" width="230" height="90" fill="#fff" stroke="#2d526e" stroke-width="2"/>
<text x="705" y="254" font-size="16" fill="#33475b">A ready server</text>
<text x="705" y="278" font-size="13" font-weight="400" fill="#33475b">Same server, now running</text>
<text x="705" y="296" font-size="13" font-weight="400" fill="#33475b">your software.</text>
<path d="M260 267 H586" stroke="#33475b" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)"/>
<text x="423" y="258" font-size="13" font-weight="400" fill="#33475b">becomes</text>
<text x="425" y="360" font-size="14" font-style="italic" font-weight="400" fill="#4a6178">Terraform remembers what it built (a state file). Ansible remembers nothing: it asks the server each time.</text>
</svg>
