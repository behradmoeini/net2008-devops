<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#33475b"/></marker></defs>
<rect x="1" y="1" width="848" height="438" rx="3" fill="#f6fbff" stroke="#d3e3ee"/>
<text x="425" y="44" font-size="23" fill="#33475b">One command creates a whole group of resources</text>
<rect x="25" y="150" width="120" height="70" fill="#fff" stroke="#2d526e" stroke-width="2"/>
<text x="85" y="180" font-size="15" fill="#33475b">You</text>
<text x="85" y="200" font-size="12" font-weight="400" fill="#4a6178">in a browser</text>
<path d="M145 185 H178" stroke="#33475b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="182" y="130" width="190" height="110" fill="#cdeaf8" stroke="#4ab8e8" stroke-width="2"/>
<rect x="182" y="130" width="190" height="34" fill="#4ab8e8"/>
<text x="277" y="153" font-size="16" fill="#fff">Cloud Shell</text>
<text x="277" y="190" font-size="13" font-weight="400" fill="#33475b">a remote control:</text>
<text x="277" y="208" font-size="13" font-weight="400" fill="#33475b">you type az commands.</text>
<text x="277" y="226" font-size="13" font-weight="400" fill="#f21d1d">It is not the VM.</text>
<path d="M372 185 H436" stroke="#33475b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="404" y="172" font-size="12" fill="#33475b">az vm</text>
<text x="404" y="206" font-size="12" fill="#33475b">create</text>
<rect x="440" y="70" width="385" height="320" fill="#fff" stroke="#2d526e" stroke-width="2"/>
<rect x="440" y="70" width="385" height="34" fill="#2d526e"/>
<text x="632" y="93" font-size="16" fill="#fff">Azure</text>
<rect x="458" y="120" width="349" height="254" fill="#f6fbff" stroke="#78b83e" stroke-width="2" stroke-dasharray="6 4"/>
<text x="632" y="144" font-size="14" fill="#33475b">Resource group: iac-practice-rg</text>
<rect x="476" y="160" width="150" height="54" fill="#78b83e"/>
<text x="551" y="183" font-size="15" fill="#fff">VM</text>
<text x="551" y="201" font-size="12" font-weight="400" fill="#fff">cloud-vm</text>
<rect x="640" y="160" width="150" height="54" fill="#cdeaf8" stroke="#4ab8e8"/>
<text x="715" y="183" font-size="14" fill="#33475b">Disk</text>
<text x="715" y="201" font-size="12" font-weight="400" fill="#33475b">the VM's storage</text>
<rect x="476" y="228" width="150" height="54" fill="#cdeaf8" stroke="#4ab8e8"/>
<text x="551" y="251" font-size="14" fill="#33475b">Network card</text>
<text x="551" y="269" font-size="12" font-weight="400" fill="#33475b">connects the VM</text>
<rect x="640" y="228" width="150" height="54" fill="#cdeaf8" stroke="#4ab8e8"/>
<text x="715" y="251" font-size="14" fill="#33475b">Public IP address</text>
<text x="715" y="269" font-size="12" font-weight="400" fill="#33475b">reachable from outside</text>
<rect x="476" y="296" width="150" height="54" fill="#cdeaf8" stroke="#4ab8e8"/>
<text x="551" y="319" font-size="14" fill="#33475b">Virtual network</text>
<text x="551" y="337" font-size="12" font-weight="400" fill="#33475b">your private network</text>
<rect x="640" y="296" width="150" height="54" fill="#cdeaf8" stroke="#4ab8e8"/>
<text x="715" y="319" font-size="14" fill="#33475b">Firewall (NSG)</text>
<text x="715" y="337" font-size="12" font-weight="400" fill="#33475b">which traffic may enter</text>
<text x="425" y="418" font-size="14" font-style="italic" font-weight="400" fill="#4a6178">Delete the resource group and everything inside it is deleted.</text>
</svg>
