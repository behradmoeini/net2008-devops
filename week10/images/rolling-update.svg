<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">
<rect x="1" y="1" width="848" height="338" rx="3" fill="#f6fbff" stroke="#d3e3ee"/>
<text x="425" y="42" font-size="23" fill="#33475b">Rolling update</text>
<g font-size="16" fill="#33475b" text-anchor="end">
<text x="160" y="103">Start</text>
<text x="160" y="163">Step 1</text>
<text x="160" y="223">Step 2</text>
<text x="160" y="283">Done</text>
</g>
<g font-size="16" fill="#fff">
<rect x="190" y="75" width="96" height="44" fill="#4ab8e8"/><text x="238" y="103">v1</text>
<rect x="300" y="75" width="96" height="44" fill="#4ab8e8"/><text x="348" y="103">v1</text>
<rect x="410" y="75" width="96" height="44" fill="#4ab8e8"/><text x="458" y="103">v1</text>
<rect x="190" y="135" width="96" height="44" fill="#78b83e"/><text x="238" y="163">v2</text>
<rect x="300" y="135" width="96" height="44" fill="#4ab8e8"/><text x="348" y="163">v1</text>
<rect x="410" y="135" width="96" height="44" fill="#4ab8e8"/><text x="458" y="163">v1</text>
<rect x="190" y="195" width="96" height="44" fill="#78b83e"/><text x="238" y="223">v2</text>
<rect x="300" y="195" width="96" height="44" fill="#78b83e"/><text x="348" y="223">v2</text>
<rect x="410" y="195" width="96" height="44" fill="#4ab8e8"/><text x="458" y="223">v1</text>
<rect x="190" y="255" width="96" height="44" fill="#78b83e"/><text x="238" y="283">v2</text>
<rect x="300" y="255" width="96" height="44" fill="#78b83e"/><text x="348" y="283">v2</text>
<rect x="410" y="255" width="96" height="44" fill="#78b83e"/><text x="458" y="283">v2</text>
</g>
<rect x="560" y="75" width="250" height="224" fill="#fff" stroke="#d3e3ee"/>
<g font-size="14" font-weight="400" fill="#33475b" text-anchor="start">
<text x="578" y="104">Kubernetes starts a new pod,</text>
<text x="578" y="124">waits until it is ready, then</text>
<text x="578" y="144">stops an old one.</text>
<text x="578" y="180">The Service sends traffic only</text>
<text x="578" y="200">to ready pods, so users</text>
<text x="578" y="220">always get an answer.</text>
<text x="578" y="256">Bad new version? The old</text>
<text x="578" y="276">pods keep running.</text>
</g>
</svg>
