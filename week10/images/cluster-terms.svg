<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" font-family="Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#33475b"/></marker></defs>
<rect x="1" y="1" width="848" height="558" rx="3" fill="#f6fbff" stroke="#d3e3ee"/>
<text x="425" y="44" font-size="23" fill="#33475b">Cluster, nodes, service and replicas</text>
