<rect x="255" y="86" width="340" height="70" fill="#2d526e"/>
<text x="425" y="115" font-size="18" fill="#fff">Manager node</text>
<text x="425" y="141" font-size="13" font-weight="400" fill="#fff">keeps the desired state, schedules the replicas</text>
<path d="M425 156 V180 M230 180 H620 M230 180 V210 M620 180 V210" stroke="#33475b" stroke-width="2" fill="none"/>
<path d="M230 200 V212" stroke="#33475b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M620 200 V212" stroke="#33475b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<g>
<rect x="60" y="214" width="340" height="216" fill="#fff" stroke="#4ab8e8" stroke-width="2"/>
<rect x="60" y="214" width="340" height="32" fill="#4ab8e8"/>
<text x="230" y="236" font-size="16" fill="#fff">Worker node 1</text>
</g>
<g>
<rect x="450" y="214" width="340" height="216" fill="#fff" stroke="#4ab8e8" stroke-width="2"/>
<rect x="450" y="214" width="340" height="32" fill="#4ab8e8"/>
<text x="620" y="236" font-size="16" fill="#fff">Worker node 2</text>
</g>
<rect x="80" y="276" width="690" height="136" fill="#78b83e" fill-opacity="0.12" stroke="#78b83e" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="300" y="262" width="250" height="30" rx="15" fill="#78b83e"/>
<text x="425" y="283" font-size="15" fill="#fff">Service: web (3 replicas)</text>
<g>
<rect x="100" y="318" width="120" height="66" fill="#cdeaf8" stroke="#4ab8e8" stroke-width="2"/>
<text x="160" y="346" font-size="16" fill="#33475b">Replica 1</text>
<text x="160" y="368" font-size="13" font-weight="400" fill="#33475b">container</text>
</g>
<g>
<rect x="240" y="318" width="120" height="66" fill="#cdeaf8" stroke="#4ab8e8" stroke-width="2"/>
<text x="300" y="346" font-size="16" fill="#33475b">Replica 2</text>
<text x="300" y="368" font-size="13" font-weight="400" fill="#33475b">container</text>
</g>
<g>
<rect x="560" y="318" width="120" height="66" fill="#cdeaf8" stroke="#4ab8e8" stroke-width="2"/>
<text x="620" y="346" font-size="16" fill="#33475b">Replica 3</text>
<text x="620" y="368" font-size="13" font-weight="400" fill="#33475b">container</text>
</g>
<text x="425" y="486" font-size="14" font-weight="400" fill="#33475b">1 cluster, 3 nodes (1 manager, 2 workers), 1 service, 3 replicas spread over the workers</text>
<g font-size="16">
