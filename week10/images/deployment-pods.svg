<text x="425" y="532" font-size="14" font-weight="400" fill="#33475b">Each container listens on port 80, at its own pod IP. The scheduler spread the pods over the nodes.</text>
<text x="425" y="556" font-size="14" font-weight="400" fill="#33475b">Pod IPs change whenever a pod is replaced, and nothing outside the cluster can reach them.</text>
<text x="425" y="580" font-size="14" font-weight="400" fill="#33475b">Port 8090 of your laptop already points at port 30080 of agent-0 (k3d -p), but nothing listens there.</text>
