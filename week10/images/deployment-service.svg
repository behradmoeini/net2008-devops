<text x="95" y="210" font-size="14" font-family="Consolas, Menlo, monospace" font-weight="400" fill="#fff">localhost:8090</text>
<path d="M160 205 H191" stroke="#33475b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="195" y="150" width="170" height="110" fill="#f7941d"/>
<text x="280" y="184" font-size="16" fill="#fff">Service hello</text>
<text x="280" y="211" font-size="13" font-weight="400" fill="#fff">selector:</text>
<text x="280" y="234" font-size="14" font-family="Consolas, Menlo, monospace" font-weight="400" fill="#fff">app=hello</text>
<g stroke="#33475b" stroke-width="2" fill="none">
<path d="M365 205 L416 109" marker-end="url(#arrow)"/>
<path d="M365 205 H416" marker-end="url(#arrow)"/>
