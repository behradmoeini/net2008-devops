<g stroke="#33475b" stroke-width="2" fill="none">
<path d="M640 205 L574 109" marker-end="url(#arrow)"/>
<path d="M640 205 H574" marker-end="url(#arrow)"/>
<path d="M640 205 L574 301" marker-end="url(#arrow)"/>
</g>
<text x="425" y="376" font-size="15" font-style="italic" font-weight="400" fill="#4a6178">Labels connect everything: the Service and the ReplicaSet both find their pods by the label app=hello.</text>
