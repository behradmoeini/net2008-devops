<rect x="640" y="60" width="180" height="70" fill="#2d526e"/>
<text x="730" y="90" font-size="16" fill="#fff">Deployment hello</text>
<text x="730" y="115" font-size="13" font-family="Consolas, Menlo, monospace" font-weight="400" fill="#fff">replicas: 3</text>
<path d="M730 130 V166" stroke="#33475b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="770" y="153" font-size="13" fill="#33475b">creates</text>
