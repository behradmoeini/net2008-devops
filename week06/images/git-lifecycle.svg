<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Helvetica, Arial, sans-serif">
  <title>The Git lifecycle</title>
  <desc>Working directory, staging area, local repository and GitHub, with the command that moves a change between them, including git revert.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1f2937"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b45309"/>
    </marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect width="1000" height="430" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">The Git lifecycle</text>

  <g stroke="#1f2937" stroke-width="2">
    <rect x="20" y="80" width="160" height="130" rx="10" fill="#dbeafe"/>
    <rect x="286" y="80" width="160" height="130" rx="10" fill="#fef3c7"/>
    <rect x="552" y="80" width="160" height="130" rx="10" fill="#dcfce7"/>
    <rect x="818" y="80" width="160" height="130" rx="10" fill="#e5e7eb"/>
  </g>
  <g text-anchor="middle" fill="#111827">
    <text x="100" y="120" font-size="17" font-weight="bold">Working</text>
    <text x="100" y="142" font-size="17" font-weight="bold">directory</text>
    <text x="100" y="175" font-size="14">files you edit</text>
    <text x="366" y="120" font-size="17" font-weight="bold">Staging</text>
    <text x="366" y="142" font-size="17" font-weight="bold">area</text>
    <text x="366" y="170" font-size="13">changes picked for</text>
    <text x="366" y="188" font-size="13">the next commit</text>
    <text x="632" y="120" font-size="17" font-weight="bold">Local</text>
    <text x="632" y="142" font-size="17" font-weight="bold">repository</text>
    <text x="632" y="170" font-size="13">saved history</text>
    <text x="632" y="188" font-size="13">(.git folder)</text>
    <text x="898" y="120" font-size="17" font-weight="bold">GitHub</text>
    <text x="898" y="142" font-size="17" font-weight="bold">(origin)</text>
    <text x="898" y="175" font-size="14">remote copy</text>
  </g>
  <g stroke="#1f2937" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="182" y1="115" x2="284" y2="115"/>
    <line x1="448" y1="115" x2="550" y2="115"/>
    <line x1="714" y1="115" x2="816" y2="115"/>
  </g>
  <g text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#111827">
    <text x="233" y="104">git add</text>
    <text x="499" y="104">git commit</text>
    <text x="765" y="104">git push</text>
  </g>
  <g stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#b)">
    <line x1="816" y1="165" x2="714" y2="165"/>
    <line x1="550" y1="165" x2="448" y2="165"/>
    <line x1="284" y1="165" x2="182" y2="165"/>
  </g>
  <g text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#92400e">
    <text x="765" y="184">git pull</text>
    <text x="765" y="200">git fetch</text>
    <text x="499" y="184">git restore</text>
    <text x="499" y="200">--staged FILE</text>
    <text x="233" y="184">git restore</text>
    <text x="233" y="200">FILE</text>
  </g>

  <path d="M596 212 C586 266 678 266 668 214" stroke="#6d28d9" stroke-width="2.5" fill="none" marker-end="url(#c)"/>
  <text x="632" y="274" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#6d28d9">git revert COMMIT</text>
  <text x="632" y="292" text-anchor="middle" font-size="12" fill="#6d28d9">adds a commit that cancels an old one</text>

  <text x="30" y="295" font-size="16" font-weight="bold" fill="#111827">What git status calls a file</text>
  <g stroke="#1f2937" stroke-width="1.5" font-size="14" fill="#111827" text-anchor="middle">
    <rect x="30" y="310" width="215" height="70" rx="8" fill="#dbeafe"/>
    <rect x="270" y="310" width="215" height="70" rx="8" fill="#dbeafe"/>
    <rect x="510" y="310" width="215" height="70" rx="8" fill="#fef3c7"/>
    <rect x="750" y="310" width="220" height="70" rx="8" fill="#dcfce7"/>
  </g>
  <g text-anchor="middle" fill="#111827" font-size="14">
    <text x="137" y="337" font-weight="bold">Untracked</text>
    <text x="137" y="359">new file, never added</text>
    <text x="377" y="337" font-weight="bold">Modified, not staged</text>
    <text x="377" y="359">tracked file, edited</text>
    <text x="617" y="337" font-weight="bold">Staged</text>
    <text x="617" y="359">after git add</text>
    <text x="860" y="337" font-weight="bold">Committed</text>
    <text x="860" y="359">after git commit</text>
  </g>
  <g stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="247" y1="345" x2="268" y2="345"/>
    <line x1="487" y1="345" x2="508" y2="345"/>
    <line x1="727" y1="345" x2="748" y2="345"/>
  </g>
  <text x="500" y="410" text-anchor="middle" font-size="14" fill="#374151">Edit, then add, then commit, then push. Pull brings new work back from GitHub.</text>
</svg>
